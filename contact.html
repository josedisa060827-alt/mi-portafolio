<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto | Jose Armando Diaz Salazar</title>
  <meta name="description" content="Escribe a Jose Armando Diaz Salazar para colaborar en un proyecto.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">J. Armando Diaz</a>
    <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu">Menú</button>
    <nav id="menu" class="nav">
      <a href="index.html">Inicio</a>
      <a href="about.html">Sobre mí</a>
      <a href="index.html#proyectos">Proyectos</a>
      <a href="contact.html" aria-current="page">Contacto</a>
    </nav>
  </header>

  <main>
    <section class="section contact">
      <div class="contact-info">
        <h1>Contacto</h1>
        <p class="lead">Cuéntame qué necesitas y te respondo por correo.</p>
        <ul class="contact-list">
          <li><span>Correo</span><a href="mailto:tucorreo@ejemplo.com">tucorreo@ejemplo.com</a></li>
          <li><span>GitHub</span><a href="https://github.com/tu-usuario" rel="noopener">github.com/tu-usuario</a></li>
          <li><span>LinkedIn</span><a href="https://www.linkedin.com/in/tu-usuario" rel="noopener">linkedin.com/in/tu-usuario</a></li>
        </ul>
      </div>

      <form id="contact-form" class="form" novalidate>
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" autocomplete="name" required>
        <p class="error" data-for="nombre"></p>

        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <p class="error" data-for="email"></p>

        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
        <p class="error" data-for="mensaje"></p>

        <button class="btn btn-primary" type="submit">Enviar mensaje</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year">2026</span> Jose Armando Diaz Salazar</p>
    <p><a href="index.html">Inicio</a> · <a href="about.html">Sobre mí</a></p>
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
